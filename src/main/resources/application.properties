spring.application.name=contract-management-api

# Server
server.servlet.context-path=/api

# Profile
spring.profiles.active=${APP_PROFILE:dev}

# JPA
spring.jpa.open-in-view=false

# Flyway
# Existing databases (created by Hibernate before Flyway) are baselined at V1 and only receive V2+.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Pagination
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.serialization-mode=via-dto

# CORS
cors.origins=${REACT_APP:http://localhost:5173}

# Open API Docs
springdoc.open-api.title=Contract Management API
springdoc.open-api.description=Component responsible for management of radio contracts
springdoc.open-api.version=1.0.0

# PDF Target Path
pdf.target=${PDF_TARGET:}

# Zap Sign API Token
zapsign.token=${ZAPSIGN_TOKEN:}

# Zap Sign Templates
zapsign.template.token.cnpj=${CNPJ_TEMPLATE_TOKEN:}

# Multipart upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:6MB}

# Object Storage (any S3-compatible provider: AWS S3, SeaweedFS, RustFS, Garage, Cloudflare R2...)
storage.bucket=${STORAGE_BUCKET:contract-management}
storage.region=${STORAGE_REGION:us-east-1}
# Leave endpoint empty to use AWS S3 itself
storage.endpoint=${STORAGE_ENDPOINT:}
# Endpoint used in presigned URLs (reachable by the browser). Defaults to storage.endpoint
storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:}
# Leave keys empty to use the AWS default credentials chain (env vars, IAM role, etc.)
storage.access-key=${STORAGE_ACCESS_KEY:}
storage.secret-key=${STORAGE_SECRET_KEY:}
storage.path-style-access=${STORAGE_PATH_STYLE_ACCESS:false}
storage.url-expiration=${STORAGE_URL_EXPIRATION:1h}
storage.auto-create-bucket=${STORAGE_AUTO_CREATE_BUCKET:false}
