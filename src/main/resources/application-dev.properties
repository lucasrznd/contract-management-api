# Datasource
spring.datasource.url=jdbc:postgresql://localhost:5432/db_contracts
spring.datasource.username=user
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver
#spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
# Schema is managed by Flyway (db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
## spring.jpa.show-sql=true

# Object Storage (SeaweedFS from docker-compose)
storage.endpoint=http://localhost:8333
storage.access-key=dev-access-key
storage.secret-key=dev-secret-key
storage.path-style-access=true
storage.auto-create-bucket=true
